  description: >-
    In December the club sets the speaker aside and gives the hour to the season: seasonal songs and
    stories from the people in the room. Bring an object from a holiday past, a candle or an ornament
    or a photograph or a recipe card, with the story that goes with it. If the object is long gone,
    bring the memory.
    <br><br>
    We will have music, a menorah, and flameless Kwanzaa candles, and time to hear how Hanukkah,
    Christmas, Kwanzaa, and the solstice are kept in this community. You are welcome to listen whether
    or not you celebrate any of it. Come for the songs even if you have no story to tell.
