---
- title: Love Beyond a Lifetime
  subtitle: Organ Donation as an Act of Faith
  date: Friday, November 13, 2026
  description: Registering to be an organ and tissue donor is a profound act of human kindness. It gives another person the opportunity 
    to live life to their fullest potential. It is a deeply emotional choice and arguably the greatest gift one could ever give or receive.<br><br>
    Sonya Wilson and Damita Barbee of Donor Network West will describe their experience as transplant recipients and why they use the acronym H.O.P.E. to explain it.
  image: sonya_wilson.webp
  image_alt: Sonya Wilson
  speaker: Sonya Wilson
  speaker_bio:  Sonya Wilson is a resilient and grateful member of our community, having received a life-changing kidney transplant 
    in February 2015 after battling IgA Nephropathy. This gift enabled her to witness her sons' marriages and become a grandmother. 
    Sonya completed her psychology degree in 2022. She has been a Donate Life Ambassador for a decade, passionately sharing her story 
    to honor her donors and advocate for the transformative power of organ and tissue donation. Sonya's journey is a testament to the 
    life-saving potential of generosity.
  image2: damita_barbee.webp
  image2_alt: Damita Barbee
  speaker2: Damita Barbee
  speaker2_bio: Damita J. Barbee led a vibrant life in finance before Pulmonary Fibrosis struck. After her diagnosis in 2010 and 
    subsequent lung transplant on August 15, 2014, she became a passionate voice for organ donation with Donor Network West. As a 
    Lead Ambassador, Damita shares her journey to inspire and educate diverse communities about the life-saving impact of donation. 
    Her story is one of resilience, gratitude, and living each day to the fullest, thanks to her donor's gift. Damita's advocacy 
    highlights the importance of organ donation, encouraging others to embrace hope and second chances at life.
  month: 2026-11
