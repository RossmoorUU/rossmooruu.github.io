title: Unitarian Universalists of Rossmoor
description: A club for Unitarian Universalists in the Rossmoor 55+ community, Walnut Creek, CA. Monthly programs on spirituality, justice and community.
baseurl: "" # Leave empty for root directory
url: "https://rossmooruu.org" # Your website URL

# EmailOctopus sign-up form id (the uuid in the dashboard's "Add to your website"
# snippet). Leave empty to show the mailto fallback in _includes/signup.html
# instead. Never put the EmailOctopus API key here — this file ships to visitors.
emailoctopus_form_id: ""

# Build settings
plugins:
  - jekyll-sitemap

# Exclude files and directories from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# GitHub Pages settings
github:
  is_project_page: false
